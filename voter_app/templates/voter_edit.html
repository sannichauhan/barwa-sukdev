<!DOCTYPE html>
<html>
<head>
    <title>Edit Voter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>वोटर डेटा एडिट करें</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Update करें</button>
        <a href="{% url 'voter_list' %}" class="btn btn-secondary">वापस जाएं</a>
    </form>
</body>
</html>
